<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Duet Live Viewer</title>
    <style>
      :root {
        --bg: #f4ecde;
        --panel: rgba(255, 250, 242, 0.76);
        --text: #1f1a16;
        --muted: #6e655b;
        --line: rgba(31, 26, 22, 0.1);
        --gemini: #fff1e7;
        --gpt: #ebf8ee;
        --accent: #b45b30;
        --shadow: 0 20px 46px rgba(64, 41, 16, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(180, 91, 48, 0.12), transparent 24%),
          radial-gradient(circle at bottom right, rgba(51, 139, 100, 0.12), transparent 28%),
          linear-gradient(180deg, #fbf7f0 0%, #efe5d2 100%);
      }

      .page {
        width: min(1080px, calc(100% - 24px));
        margin: 20px auto 40px;
      }

      .hero,
      .stream {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .hero {
        padding: 24px;
      }

      .eyebrow {
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 12px;
      }

      h1 {
        margin: 12px 0 10px;
        font-size: clamp(34px, 6vw, 62px);
        line-height: 0.95;
      }

      .sub {
        color: var(--muted);
        line-height: 1.7;
        max-width: 760px;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .metric {
        border-radius: 18px;
        border: 1px solid var(--line);
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.52);
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }

      .metric-value {
        font-size: 19px;
      }

      .stream {
        padding: 18px;
        margin-top: 18px;
      }

      .cards {
        display: grid;
        gap: 12px;
      }

      .card {
        border-radius: 22px;
        border: 1px solid var(--line);
        padding: 16px;
      }

      .card-gemini {
        background: linear-gradient(180deg, #fffaf5 0%, var(--gemini) 100%);
      }

      .card-gpt {
        background: linear-gradient(180deg, #f8fffb 0%, var(--gpt) 100%);
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .speaker {
        font-weight: 700;
        font-size: 18px;
      }

      .turn {
        color: var(--muted);
        font-size: 13px;
      }

      .text {
        white-space: pre-wrap;
        line-height: 1.8;
        font-size: 17px;
      }

      .empty {
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .meta {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 560px) {
        .meta {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="eyebrow">Live Feed</div>
        <h1>双模型对话</h1>
        <div class="sub">这个页面会读取最新一次运行的 `live_state.json`，实时展示 Gemini 3 Pro 和 GPT-5.4 的轮流发言。</div>
        <div class="meta" id="meta"></div>
      </section>
      <section class="stream">
        <div class="cards" id="cards"></div>
      </section>
    </main>
    <script>
      const metaEl = document.getElementById("meta");
      const cardsEl = document.getElementById("cards");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function renderMeta(data) {
        const history = data.history || [];
        const latest = history[history.length - 1];
        const items = [
          ["状态", data.status || "-"],
          ["轮次", latest ? `${latest.turn_index} / ${data.meta?.turns || "-"}` : "-"],
          ["最新说话者", latest?.speaker_name || "-"],
          ["更新时间", data.updated_at ? new Date(data.updated_at).toLocaleTimeString("zh-CN", { hour12: false }) : "-"],
        ];
        metaEl.innerHTML = items.map(([label, value]) => `
          <div class="metric">
            <div class="metric-label">${label}</div>
            <div class="metric-value">${escapeHtml(value)}</div>
          </div>
        `).join("");
      }

      function renderHistory(history) {
        if (!history || history.length === 0) {
          cardsEl.innerHTML = `<div class="empty">还没有对话记录，先运行 ` + "`run_duet.py`" + `。</div>`;
          return;
        }
        cardsEl.innerHTML = [...history].reverse().map((item) => `
          <article class="card card-${item.speaker_id}">
            <div class="card-head">
              <div class="speaker">${escapeHtml(item.speaker_name)}</div>
              <div class="turn">第 ${item.turn_index} 轮</div>
            </div>
            <div class="text">${escapeHtml(item.text || "")}</div>
          </article>
        `).join("");
      }

      async function refresh() {
        try {
          const response = await fetch("/api/latest", { cache: "no-store" });
          const data = await response.json();
          renderMeta(data);
          renderHistory(data.history || []);
        } catch (error) {
          metaEl.innerHTML = "";
          cardsEl.innerHTML = `<div class="empty">无法读取最新运行结果，请确认本地 viewer 已启动。</div>`;
        }
      }

      refresh();
      setInterval(refresh, 1500);
    </script>
  </body>
</html>
