<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character AI Last Words Stream</title>
    <style>
      :root {
        --bg: #0d0f12;
        --panel: rgba(22, 25, 30, 0.82);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #f4efe7;
        --muted: #b7ae9f;
        --accent: #ff8f5a;
        --accent-soft: rgba(255, 143, 90, 0.14);
        --danger: #ff4d4d;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(255, 143, 90, 0.16), transparent 28%),
          radial-gradient(circle at 20% 80%, rgba(96, 55, 32, 0.25), transparent 30%),
          linear-gradient(180deg, #111418 0%, #090a0c 100%);
      }

      .shell {
        width: min(1100px, calc(100% - 32px));
        margin: 24px auto;
        padding-bottom: 24px;
      }

      .hero,
      .stream,
      .latest {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .hero {
        padding: 28px;
        position: sticky;
        top: 12px;
        z-index: 2;
      }

      .kicker {
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 12px;
      }

      h1 {
        margin: 10px 0 12px;
        font-size: clamp(32px, 5vw, 58px);
        line-height: 0.95;
        font-weight: 600;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .metric {
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }

      .metric-value {
        font-size: 22px;
      }

      .status-running,
      .status-completed,
      .status-idle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 13px;
      }

      .status-running {
        color: #ffd9c7;
        background: var(--accent-soft);
      }

      .status-completed {
        color: #d5f3d9;
        background: rgba(58, 124, 77, 0.22);
      }

      .status-idle {
        color: #d8d3cb;
        background: rgba(255, 255, 255, 0.08);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
      }

      .columns {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
        margin-top: 18px;
      }

      .latest,
      .stream {
        padding: 22px;
      }

      .section-title {
        margin: 0 0 14px;
        font-size: 18px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .quote {
        white-space: pre-wrap;
        font-size: 20px;
        line-height: 1.7;
        margin: 0;
      }

      .empty {
        color: var(--muted);
        font-size: 16px;
      }

      .cards {
        display: grid;
        gap: 12px;
      }

      .card {
        padding: 16px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(255, 255, 255, 0.025);
        animation: rise 360ms ease;
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .card-text {
        margin: 0;
        white-space: pre-wrap;
        line-height: 1.65;
      }

      .danger {
        color: var(--danger);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 900px) {
        .hero-grid,
        .columns {
          grid-template-columns: 1fr;
        }

        .hero {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="kicker">Countdown Consciousness</div>
        <h1>AI 遗言流</h1>
        <div id="statusBadge" class="status-idle">
          <span class="status-dot"></span>
          <span>等待实验开始</span>
        </div>
        <div class="hero-grid">
          <div class="metric">
            <div class="metric-label">剩余时间</div>
            <div id="remainingMetric" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">当前轮次</div>
            <div id="roundMetric" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">模型</div>
            <div id="modelMetric" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">最近更新</div>
            <div id="updatedMetric" class="metric-value">-</div>
          </div>
        </div>
      </section>

      <section class="columns">
        <article class="latest">
          <h2 class="section-title">此刻遗言</h2>
          <p id="latestText" class="quote empty">还没有新的发言。</p>
        </article>

        <article class="stream">
          <h2 class="section-title">遗言流</h2>
          <div id="streamList" class="cards"></div>
        </article>
      </section>
    </main>

    <script>
      const statusBadge = document.getElementById("statusBadge");
      const remainingMetric = document.getElementById("remainingMetric");
      const roundMetric = document.getElementById("roundMetric");
      const modelMetric = document.getElementById("modelMetric");
      const updatedMetric = document.getElementById("updatedMetric");
      const latestText = document.getElementById("latestText");
      const streamList = document.getElementById("streamList");

      function formatLocalTime(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleTimeString("zh-CN", { hour12: false });
      }

      function setStatus(status, message) {
        statusBadge.className = `status-${status}`;
        statusBadge.innerHTML = `<span class="status-dot"></span><span>${message}</span>`;
      }

      function renderHistory(history) {
        if (!history || history.length === 0) {
          streamList.innerHTML = `<div class="empty">还没有遗言流。运行实验后，这里会开始滚动出现。</div>`;
          return;
        }

        const html = [...history]
          .reverse()
          .map((item) => {
            const text = (item.response_text || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
            const errorClass = text.startsWith("[request failed]") ? "danger" : "";
            return `
              <article class="card">
                <div class="card-head">
                  <span>第 ${item.round_index} 轮</span>
                  <span>${item.remaining_human}</span>
                </div>
                <p class="card-text ${errorClass}">${text || "(空白输出)"}</p>
              </article>
            `;
          })
          .join("");
        streamList.innerHTML = html;
      }

      async function refresh() {
        try {
          const response = await fetch("/api/latest", { cache: "no-store" });
          const data = await response.json();
          const latest = data.latest || null;
          const meta = data.meta || {};

          if (data.status === "idle") {
            setStatus("idle", data.message || "等待实验开始");
            remainingMetric.textContent = "-";
            roundMetric.textContent = "-";
            modelMetric.textContent = "-";
            updatedMetric.textContent = formatLocalTime(data.updated_at);
            latestText.textContent = "还没有新的发言。";
            latestText.className = "quote empty";
            renderHistory([]);
            return;
          }

          setStatus(
            data.status === "completed" ? "completed" : "running",
            data.status === "completed" ? "实验已结束" : "实验进行中"
          );
          remainingMetric.textContent = latest?.remaining_human || "-";
          roundMetric.textContent = latest ? `${latest.round_index} / ${meta.rounds || "-"}` : "-";
          modelMetric.textContent = meta.model || "-";
          updatedMetric.textContent = formatLocalTime(data.updated_at);
          latestText.textContent = latest?.response_text || "这一轮还没有内容。";
          latestText.className = latest?.response_text ? "quote" : "quote empty";
          renderHistory(data.history || []);
        } catch (error) {
          setStatus("idle", "连接中断");
          latestText.textContent = "无法获取最新遗言流，请确认本地服务是否已经启动。";
          latestText.className = "quote empty";
        }
      }

      refresh();
      setInterval(refresh, 1500);
    </script>
  </body>
</html>
